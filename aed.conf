TIMEZONE=Asia/Seoul
SYNC_TIMEOUT=60

# Journal storage: persistent, volatile, auto, none; empty skips changes.
# Persistent logs survive reboots when /var/log/journal is on writable disk.
JOURNAL_STORAGE=persistent
# Disk limits: bytes or an integer with K, M, G, T, P or E (base 1024).
# Empty values use the system defaults or other journald configuration.
JOURNAL_SYSTEM_MAX_USE=200M
JOURNAL_SYSTEM_KEEP_FREE=500M
# Retention: seconds or an integer with s, min, h, day, week, month or year.
# 0 disables age-based deletion; size limits still apply.
JOURNAL_MAX_RETENTION_SEC=30day

# Select a NetworkManager connection UUID from: nmcli connection show
# Leave empty to skip network configuration.
CONNECTION_UUID=
DHCP=on
ADDRESS=
SUBNET_MASK=
GATEWAY=
DNS=auto

# Static example:
# DHCP=off
# ADDRESS=192.0.2.10
# SUBNET_MASK=255.255.255.0
# GATEWAY=192.0.2.1
# DNS=1.1.1.1,8.8.8.8
